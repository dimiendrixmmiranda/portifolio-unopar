<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Validador MiniLang</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }

        textarea {
            width: 100%;
            height: 200px;
            margin-bottom: 10px;
            font-family: monospace;
        }

        button {
            padding: 10px 15px;
            cursor: pointer;
        }

        .result {
            margin-top: 15px;
            padding: 10px;
            background: white;
            border-radius: 5px;
        }

        .ok {
            color: green;
        }

        .erro {
            color: red;
        }
    </style>
</head>

<body>

    <h1>Validador MiniLang</h1>

    <textarea id="codigo" placeholder="Cole seu código MiniLang aqui..."></textarea>
    <br>
    <button onclick="validar()">Validar Código</button>

    <div class="result" id="resultado"></div>

    <script>
        function validar() {
            const codigo = document.getElementById("codigo").value;

            // EXPRESSÕES REGULARES
            const declaracao = /var\s+[a-zA-Z][a-zA-Z0-9_]*\s*:\s*(int|float|bool|string)\s*;/;
            const atribuicao = /[a-zA-Z][a-zA-Z0-9_]*\s*=\s*("[^"]*"|\d+(\.\d+)?)\s*;/;
            const condicional = /if\s*\(.*?\)\s*\{[\s\S]*?\}/;
            const comentario = /\/\/.*/;

            // TESTES
            const temDeclaracao = declaracao.test(codigo);
            const temAtribuicao = atribuicao.test(codigo);
            const temCondicional = condicional.test(codigo);
            const temComentario = comentario.test(codigo);

            // RESULTADO
            let resultadoHTML = "<h3>Resultado da Análise:</h3>";

            resultadoHTML += `<p class="${temDeclaracao ? 'ok' : 'erro'}">
        Declaração de variável: ${temDeclaracao ? 'OK' : 'NÃO ENCONTRADO'}
      </p>`;

            resultadoHTML += `<p class="${temAtribuicao ? 'ok' : 'erro'}">
        Atribuição: ${temAtribuicao ? 'OK' : 'NÃO ENCONTRADO'}
      </p>`;

            resultadoHTML += `<p class="${temCondicional ? 'ok' : 'erro'}">
        Estrutura IF: ${temCondicional ? 'OK' : 'NÃO ENCONTRADO'}
      </p>`;

            resultadoHTML += `<p class="${temComentario ? 'ok' : 'erro'}">
        Comentário: ${temComentario ? 'OK' : 'NÃO ENCONTRADO'}
      </p>`;

            // VALIDAÇÃO FINAL
            if (temDeclaracao && temAtribuicao && temCondicional && temComentario) {
                resultadoHTML += `<h2 class="ok">Código VÁLIDO ✅</h2>`;
            } else {
                resultadoHTML += `<h2 class="erro">Código INVÁLIDO ❌</h2>`;
            }

            document.getElementById("resultado").innerHTML = resultadoHTML;
        }
    </script>

</body>

</html>
